name: ProfitGuard health
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Regression tests
        run: node --test tests/engine.test.js
      - name: Verify live site
        id: live
        run: node scripts/health.mjs
      - name: Open unique incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh issue list --state open --search 'ProfitGuard automated health failure in:title' --json number --jq 'length')" -eq 0 ]; then
            gh issue create --title 'ProfitGuard automated health failure' --body "The scheduled or push health check failed. Inspect run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
